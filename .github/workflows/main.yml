# Created by MichaelCurrin
# https://gist.github.com/MichaelCurrin/a698731096f78240f653faf9a9127cba
#
# Builds the editor and deploys it to GitHub Pages.
#
# The editor needs VITE_* variables at build time. Because this repository is
# public, the full contents of apps/editor/.env are stored in the
# EDITOR_ENV secret (repo or github-pages environment scope) and written to
# apps/editor/.env (gitignored, loaded by Vite in every mode) right before the
# build. Use the public URLs (e.g. https://preview.andres6936.dev/) for the
# deployed build, not localhost.

name: Build and deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --filter '*'

      - name: Inject editor environment
        env:
          EDITOR_ENV: ${{ secrets.EDITOR_ENV }}
        run: |
          if [ -z "${EDITOR_ENV:-}" ]; then
            echo "::warning::Secret EDITOR_ENV is not set; building without VITE_* variables"
          else
            # apps/editor/.env is gitignored and Vite loads it in every mode.
            printf '%s\n' "$EDITOR_ENV" > apps/editor/.env
            echo "Wrote apps/editor/.env ($(wc -l < apps/editor/.env) lines)"
          fi

      - name: Build the page
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          bun run --filter editor build

      - name: Add 404 fallback for SPA routing
        # Ensures client-side routing works on refresh by copying index.html to 404.html
        run: cp apps/editor/build/client/index.html apps/editor/build/client/404.html

      - name: Upload production assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: "apps/editor/build/client"

      - name: Deploy to GH Pages
        id: deployment
        uses: actions/deploy-pages@v4
